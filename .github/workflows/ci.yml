name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[web,dev]' build
      - run: python -m pytest -q
      - run: python -m build
      - name: Verify installed wheel and packaged assets outside checkout
        run: |
          python -m venv /tmp/scarletcal-wheel
          /tmp/scarletcal-wheel/bin/pip install dist/*.whl 'fastapi>=0.115,<1' 'httpx>=0.28,<1'
          cd /tmp
          /tmp/scarletcal-wheel/bin/python -c "from fastapi.testclient import TestClient; from scarletcal.web.app import app; c = TestClient(app); assert c.get('/healthz').status_code == 200; assert c.get('/static/style.css').status_code == 200"
