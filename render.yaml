# Configuration only. Creating a Render Blueprint is a separate deployment step.
services:
  - type: web
    name: scarletcal-api
    runtime: python
    plan: free
    buildCommand: pip install '.[web]'
    startCommand: scarletcal-web --host 0.0.0.0
    healthCheckPath: /healthz
    autoDeployTrigger: off
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.6
      - key: SCARLETCAL_ALLOWED_ORIGINS
        value: https://ysoni18.github.io
