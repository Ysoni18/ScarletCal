[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scarletcal"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["icalendar>=7.2,<8", "tzdata>=2026.1"]

[project.optional-dependencies]
dev = ["pytest>=9,<10"]

[project.scripts]
scarletcal = "scarletcal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scarletcal = ["data/rutgers/new_brunswick/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
